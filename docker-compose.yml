version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: shopverse-db
    environment:
      POSTGRES_DB: shopverse
      POSTGRES_USER: shopverse_user
      POSTGRES_PASSWORD: shopverse_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopverse_user -d shopverse"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
