spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shopverse}
    username: ${SPRING_DATASOURCE_USERNAME:shopverse_user}
    password: ${SPRING_DATASOURCE_PASSWORD:shopverse_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

app:
  jwt:
    secret: ${APP_JWT_SECRET:ShopVerseSecretKey2024XYZSecureTokenForJWTGeneration256BitsLong}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}
  admin:
    email: ${APP_ADMIN_EMAIL:admin@shopverse.com}
    password: ${APP_ADMIN_PASSWORD:Admin@123456}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.shopverse: INFO
    org.springframework.security: WARN
